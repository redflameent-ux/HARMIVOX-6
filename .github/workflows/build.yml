name: Build HARMIVOX-6

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev libgl1-mesa-dev ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHVX_BUILD_TESTS=ON
      - name: Build tests
        run: cmake --build build --target HvxTests
      - name: Run tests
        run: ./build/HvxTests_artefacts/Release/HvxTests test-output

  windows:
    name: Windows VST3 + standalone
    runs-on: windows-latest
    needs: engine-tests
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --target Harmivox6_VST3 Harmivox6_Standalone --parallel 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build-log.txt -Pattern ' error |fatal error' | Select-Object -First 40 | ForEach-Object {
              $l = $_.Line -replace '^.*[\\/]Source[\\/]', 'Source/'
              if ($l.Length -gt 600) { $l = $l.Substring(0, 600) }
              Write-Output "::error::$l"
            }
            exit 1
          }
      - name: Package
        shell: pwsh
        run: |
          $out = "HARMIVOX-6-Windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse "build/Harmivox6_artefacts/Release/VST3/HARMIVOX-6.vst3" "$out/"
          Copy-Item "build/Harmivox6_artefacts/Release/Standalone/HARMIVOX-6.exe" "$out/"
          Copy-Item "INSTALL-WINDOWS.txt" "$out/"
          Compress-Archive -Path "$out/*" -DestinationPath "HARMIVOX-6-Windows.zip" -Force
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          $build = (Resolve-Path "build/Harmivox6_artefacts/Release").Path
          & $iscc "/DBuildDir=$build" "/DAppVersion=0.1.${{ github.run_number }}" "installer/HARMIVOX-6.iss"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Installer build failed"; exit 1 }
          Copy-Item "installer-output/HARMIVOX-6-Setup.exe" "HARMIVOX-6-Setup.exe"
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: HARMIVOX-6-Windows
          path: |
            HARMIVOX-6-Windows.zip
            HARMIVOX-6-Setup.exe
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HARMIVOX-6 (latest build)
          prerelease: true
          make_latest: true
          files: |
            HARMIVOX-6-Setup.exe
            HARMIVOX-6-Windows.zip
          body: |
            Newest Windows build of HARMIVOX-6, made automatically from the main branch.

            **Download HARMIVOX-6-Setup.exe** and double-click it. It installs the VST3 into
            C:\Program Files\Common Files\VST3 (where FL Studio and Ableton look) and, if you
            choose, the standalone app with a Start menu shortcut. Uninstall from Windows Settings > Apps.

            The .zip has the same files for manual installs.
